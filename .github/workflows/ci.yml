name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The newest DRE release (pre-releases included), and the plugins the tests declare.
      - name: Install DRE
        run: |
          curl -fsSL https://getdre.com/install.sh | DRE_INSTALL_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install plugins
        working-directory: integration_tests
        run: dre deps
      - run: integration_tests/run.sh
